<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Deep Midnight Indigo Background -->
    <radialGradient id="navy-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#16105A"/>
      <stop offset="70%" stop-color="#0E0A3C"/>
      <stop offset="100%" stop-color="#080524"/>
    </radialGradient>

    <!-- Electric Cyan to Royal Blue Metallic Ring -->
    <linearGradient id="cyan-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#00C8FF"/>
      <stop offset="70%" stop-color="#1668FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <!-- Glowing Swoosh Gradient -->
    <linearGradient id="swoosh-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="60%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#1E60FF"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="128" cy="128" r="126" fill="url(#navy-bg)"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="url(#cyan-ring)" stroke-width="10"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>

  <!-- Dynamic Orbit Swoosh -->
  <path d="M 44 140 C 44 80, 160 30, 212 90 C 180 60, 95 85, 75 145 C 70 160, 85 168, 105 168 C 70 174, 44 165, 44 140 Z" fill="url(#swoosh-grad)" opacity="0.95"/>

  <!-- Shopping Cart Icon in Crisp White -->
  <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(14, -8)">
    <path d="M72 80 h22 l18 52 h58 l16 -38 h-86"/>
    <circle cx="118" cy="150" r="7" fill="#FFFFFF" stroke="none"/>
    <circle cx="164" cy="150" r="7" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 175 64 Q 175 74 185 74 Q 175 74 175 84 Q 175 74 165 74 Q 175 74 175 64 Z" fill="#FFFFFF"/>
  <path d="M 136 50 Q 136 57 143 57 Q 136 57 136 64 Q 136 57 129 57 Q 136 57 136 50 Z" fill="#00F0FF"/>

  <!-- Monogram Initials "SL" in bold metallic styling -->
  <text x="128" y="196" font-family="'Exo 2', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SUNRISE</text>
  <text x="128" y="218" font-family="'Exo 2', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#00E5FF" text-anchor="middle" letter-spacing="6">INTERIOR</text>
</svg>
